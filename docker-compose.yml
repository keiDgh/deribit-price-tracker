services:
  backend:
    image: deribit-backend:latest
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: no
    ports:
      - "8000:8000"
    env_file:
      - "./backend/.env"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
      image: deribit-backend:latest
      build:
        context: ./backend
        dockerfile: Dockerfile
      env_file:
        - "./backend/.env"
      command: python -m app.infra.scripts.run_migrations_and_seed
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    env_file:
      - "./backend/.env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 5
  
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-vol:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  worker:
    image: deribit-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - "./backend/.env"
    command: celery -A app.infra.worker.celery_app:celery_app worker -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    image: deribit-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - "./backend/.env"
    command: celery -A app.infra.worker.celery_app:celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-vol:
  redis-vol: